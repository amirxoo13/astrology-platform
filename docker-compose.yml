version: '3.8'

services:
  # Swiss Ephemeris API
  ephemeris-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: astrology-api
    restart: unless-stopped
    environment:
      - EPHE_PATH=/app/ephe
    # No host bind-mount for /app/ephe: the ephemeris data files are
    # downloaded and baked into the image at build time (see api/Dockerfile).
    # Mounting an empty host directory here would silently shadow them.
    networks:
      - astrology-net
    # No ports published: the API is only reachable from other containers on
    # astrology-net (e.g. telegram-bot, nginx). External access must go
    # through the Nginx reverse proxy (web-server) at /api/.

  # Telegram Bot
  telegram-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: astrology-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - ephemeris-api
    networks:
      - astrology-net

  # Web Server for Charts
  web-server:
    image: nginx:1.29-alpine
    container_name: astrology-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ephemeris-api
    networks:
      - astrology-net

networks:
  astrology-net:
    driver: bridge
