# NOTE: This configuration only listens on plain HTTP (port 80). In
# production, terminate TLS in front of this proxy (e.g. via a reverse
# proxy/load balancer, or by adding a certbot-managed `listen 443 ssl;`
# server block with a real certificate) before exposing it publicly.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Basic rate limiting for the API proxy: 10 requests/second per client IP,
    # with a small burst allowance. Guards against simple abuse/floods.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Security headers. NOTE: Nginx does not inherit `add_header`
        # directives from an outer block once a location block declares its
        # own `add_header`, so these are re-declared in every location below
        # that also sets headers of its own (e.g. the static assets block).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'" always;

        # Static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # The web page checks the API through /api/health, but the upstream
        # Swiss Ephemeris API exposes health at the unprefixed /health path
        # (only its versioned endpoints live under /api/v1/...). Map the
        # public-facing /api/health path to the upstream's real /health path.
        location = /api/health {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://ephemeris-api:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # API proxy (versioned endpoints, e.g. /api/v1/birth-chart)
        location /api/ {
            # Since the web page and API are served same-origin through this
            # proxy, no CORS headers are required here. Same-origin requests
            # never trigger a browser CORS preflight, so this OPTIONS branch
            # simply avoids forwarding OPTIONS calls (e.g. from health
            # checks/tools) to the upstream API instead of proxying them.
            # If cross-origin access is ever needed, reflect a specific
            # configured origin (never a wildcard) and add the matching
            # Access-Control-Allow-* headers to this 204 response too, e.g.:
            #   add_header Access-Control-Allow-Origin "https://your-allowed-origin.example" always;
            if ($request_method = OPTIONS) {
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://ephemeris-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Re-declared because this location block sets its own
            # add_header (Cache-Control), which stops inheritance from the
            # server block above.
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'" always;
        }
    }
}
