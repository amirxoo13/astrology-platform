name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install bot modules needed to import bot.py
      run: pip install httpx==0.28.1 python-telegram-bot==22.8 geopy==2.5.0 redis==5.2.1
    - name: Run schema and LMT unit tests
      run: python -m unittest tests.test_astrology -v

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the ephemeris API Docker image
      run: docker build ./api --file api/Dockerfile --tag astrology-api:$(date +%s)
    - name: Build the Telegram bot Docker image
      run: docker build ./bot --file bot/Dockerfile --tag astrology-bot:$(date +%s)
